name: Cockpit Contract Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cockpit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run cockpit contract tests
        run: node --test tests/cockpit-contract.test.cjs
